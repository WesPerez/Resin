name: Project catalog

on:
  push:
    branches: [mine, 'candidate-*', 'feat/project-operations-*']
    paths: ['operations/**', '.github/workflows/operations.yml']
  pull_request:
    paths: ['operations/**', '.github/workflows/operations.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the published native task catalog
        run: python -m json.tool operations/project.json > /dev/null
