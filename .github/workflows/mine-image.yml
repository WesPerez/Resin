name: Mine Image

on:
  push:
    branches:
      - mine
  workflow_dispatch:

concurrency:
  group: resin-mine-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          git fetch origin master:refs/remotes/origin/master
          mapfile -t go_files < <(git diff --name-only --diff-filter=ACMR origin/master...HEAD -- '*.go')
          if (( ${#go_files[@]} == 0 )); then
            exit 0
          fi
          mapfile -t unformatted < <(gofmt -l "${go_files[@]}")
          if (( ${#unformatted[@]} > 0 )); then
            printf '%s\n' "${unformatted[@]}"
            gofmt -d "${unformatted[@]}"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run proxy and routing race tests
        run: go test -race ./internal/proxy ./internal/routing

      - name: Check entrypoint syntax
        run: sh -n docker/entrypoint.sh

  publish:
    name: Build and publish GHCR image
    needs: verify
    if: github.repository == 'WesPerez/Resin' && github.ref == 'refs/heads/mine'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build time
        id: build_time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wesperez/resin
          tags: |
            type=raw,value=mine
            type=sha,prefix=mine-,format=short
            type=sha,prefix=mine-sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/WesPerez/Resin
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=mine

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=mine
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
          cache-from: type=gha,scope=resin-mine
          cache-to: type=gha,mode=max,scope=resin-mine
          provenance: mode=max
          sbom: true
