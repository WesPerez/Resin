name: Mine Image

on:
  push:
    branches:
      - mine
      - 'candidate-*'
  workflow_dispatch:

concurrency:
  group: resin-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_FALLBACK_CONTRACT: '1'
  CI_FALLBACK_SKIP_RULES: '[{"event":"workflow_dispatch","except_refs":["refs/heads/mine","refs/heads/candidate-*"],"jobs":["Build and publish GHCR image"]}]'
  SOURCE_REPOSITORY: ${{ vars.CI_PRIMARY_REPOSITORY || github.repository }}
  SOURCE_REF_NAME: ${{ vars.CI_SOURCE_REF_NAME || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          git fetch "https://github.com/${SOURCE_REPOSITORY}.git" master:refs/remotes/primary/master
          mapfile -t go_files < <(git diff --name-only --diff-filter=ACMR refs/remotes/primary/master...HEAD -- '*.go')
          if (( ${#go_files[@]} == 0 )); then
            exit 0
          fi
          mapfile -t unformatted < <(gofmt -l "${go_files[@]}")
          if (( ${#unformatted[@]} > 0 )); then
            printf '%s\n' "${unformatted[@]}"
            gofmt -d "${unformatted[@]}"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run proxy and routing race tests
        run: go test -race ./internal/proxy ./internal/routing

      - name: Check entrypoint syntax
        run: sh -n docker/entrypoint.sh

  publish:
    name: Build and publish GHCR image
    needs: verify
    if: (vars.CI_PRIMARY_REPOSITORY || github.repository) == 'WesPerez/Resin' && ((vars.CI_SOURCE_REF || github.ref) == 'refs/heads/mine' || startsWith(vars.CI_SOURCE_REF || github.ref, 'refs/heads/candidate-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.CI_PRIMARY_OWNER || github.repository_owner }}
          password: ${{ secrets.CI_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate build time
        id: build_time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wesperez/resin
          tags: |
            type=raw,value=mine,enable=${{ (vars.CI_SOURCE_REF || github.ref) == 'refs/heads/mine' }}
            type=sha,prefix=mine-,format=short,enable=${{ (vars.CI_SOURCE_REF || github.ref) == 'refs/heads/mine' }}
            type=sha,prefix=mine-sha-,format=long,enable=${{ (vars.CI_SOURCE_REF || github.ref) == 'refs/heads/mine' }}
            type=raw,value=${{ env.SOURCE_REF_NAME }},enable=${{ startsWith(vars.CI_SOURCE_REF || github.ref, 'refs/heads/candidate-') }}
            type=sha,prefix=${{ env.SOURCE_REF_NAME }}-,format=short,enable=${{ startsWith(vars.CI_SOURCE_REF || github.ref, 'refs/heads/candidate-') }}
            type=sha,prefix=${{ env.SOURCE_REF_NAME }}-sha-,format=long,enable=${{ startsWith(vars.CI_SOURCE_REF || github.ref, 'refs/heads/candidate-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/WesPerez/Resin
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ env.SOURCE_REF_NAME }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.SOURCE_REF_NAME }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
          cache-from: type=gha,scope=resin-${{ env.SOURCE_REF_NAME }}
          cache-to: type=gha,mode=max,scope=resin-${{ env.SOURCE_REF_NAME }}
          provenance: mode=max
          sbom: true

      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, re
          digest = os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
          with open('image-metadata.json', 'w') as output:
              json.dump({'repository': os.environ['SOURCE_REPOSITORY'], 'revision': os.environ['GITHUB_SHA'], 'image': 'ghcr.io/wesperez/resin', 'digest': digest}, output)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: image-metadata.json
          if-no-files-found: error
