name: Sync Upstream Master

on:
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'WesPerez/Resin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mine

      - name: Fast-forward clean master mirror
        shell: bash
        run: |
          git remote add upstream https://github.com/Resinat/Resin.git
          git fetch upstream master
          git fetch origin master
          git merge-base --is-ancestor origin/master upstream/master
          git push origin upstream/master:master
